# Isolated, disposable database and storage for real browser/API tests.
server:
  port: 18080
spring:
  datasource:
    url: jdbc:h2:mem:poi_browser;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
app:
  seed-admin:
    email: admin@e2e.local
    password: E2eTest123!
    full-name: Browser Test Admin
  cors:
    allowed-origins: http://localhost:13000
  qr:
    base-url: http://localhost:18080/q/
  storage:
    audio-dir: ./target/e2e-storage/audio
    image-dir: ./target/e2e-storage/images
    package-dir: ./target/e2e-storage/packages
  offline-packages:
    build-delay-ms: 500
logging:
  level:
    root: WARN
