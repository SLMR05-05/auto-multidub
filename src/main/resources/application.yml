# ==============================================================================
# Multilingual Travel Guide & Auto-Narration Backend
# Cấu hình Spring Boot - Đọc tự động các biến từ file .env
# ==============================================================================

server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    # Hỗ trợ nạp trực tiếp file .env theo chuẩn Spring Boot 3
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/multilingual_travel_guide?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456789}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# ------------------------------------------------------------------------------
# App Specific Configurations (Được nạp từ .env)
# ------------------------------------------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  audio-directory: ${AUDIO_DIRECTORY:./storage/audio}
  tts:
    python-command: ${PIPER_PYTHON_COMMAND:python}
    piper-model: ${PIPER_MODEL:vi_VN-vais1000-medium}
  storage:
    audio-dir: ${AUDIO_DIRECTORY:./storage/audio}
    image-dir: ${IMAGE_DIRECTORY:./storage/images}
    package-dir: ${PACKAGE_DIRECTORY:./storage/packages}
  qr:
    base-url: ${APP_QR_BASE_URL:http://localhost:8080/q/}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  seed-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Admin}

google:
  cloud:
    project-id: ${GOOGLE_CLOUD_PROJECT_ID:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

libretranslate:
  base-url: ${LIBRETRANSLATE_BASE_URL:http://127.0.0.1:5001}

logging:
  level:
    org.springframework.security: INFO
